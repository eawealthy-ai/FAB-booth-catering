<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/fab-logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-shim.js"></script>
<title>Booth &amp; Catering Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: brand gate → top bar with brand + tabs → single working column (list / form / event sheet / menu book) */
:root{
  --bg:#f6f5f3; --surface:#ffffff; --ink:#1b1a19; --muted:#6c6862; --line:#e4e0da; --soft:#efece8;
  --brand:#c8102e; --brand-ink:#ffffff; --brand-soft:#fbe7ea; --brand-2:#c8102e;
  --good:#1f7a4d; --good-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fff1dc; --bad:#b42318; --bad-soft:#fde8e6;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1d1c1a; --ink:#f1efec; --muted:#a39e97; --line:#33302c; --soft:#262421;
  --brand:#ef4058; --brand-ink:#ffffff; --brand-soft:#3a1a1f; --brand-2:#ef4058;
  --good:#5fd39a; --good-soft:#163024; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a7e; --bad-soft:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1d1c1a; --ink:#f1efec; --muted:#a39e97; --line:#33302c; --soft:#262421;
  --brand:#ef4058; --brand-ink:#ffffff; --brand-soft:#3a1a1f; --brand-2:#ef4058;
  --good:#5fd39a; --good-soft:#163024; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a7e; --bad-soft:#3a1c19; color-scheme:dark}
/* Top Secret Café: black + gold */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.02rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}
:root{--gut:16px}
.wrap{max-width:1440px;margin:0 auto}
.pl>*{min-width:0}
.grid.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kv-num{font-size:1.45rem;font-weight:600;overflow-wrap:anywhere}
@media (max-width:820px){.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){
  main{gap:12px;padding-top:12px}
  .grid.kpis{gap:8px}
  main .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  main .grid.kpis{gap:8px}
  main .kv{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
  main .kv .wide{grid-column:1/-1}
  main .sheet-head h1{font-size:1.6rem}
  :root{--gut:10px}
  .bar .tabs{flex-wrap:wrap;overflow:visible;gap:0 2px}
  .tabs .tab{padding:6px 9px 7px;font-size:.88rem}
  .evtabs-wrap .evtabs{gap:0}
  .evtabs .evtab{flex:1 1 0;padding:10px 4px;font-size:.86rem;white-space:normal;line-height:1.25}
  .sheet-head>div:last-child{text-align:left!important;width:100%}
  .sheet-head .row{justify-content:flex-start!important}
  .mp-pop{position:fixed!important;left:12px!important;right:12px!important;top:120px!important;width:auto!important}
  .tbl-wrap:has(> table.rt){overflow:visible;background:var(--surface)}
  table.rt,table.rt tbody{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;padding:10px 12px;border-top:1px solid var(--line)}
  table.rt tr:first-child{border-top:0}
  table.rt td{display:block;padding:0!important;border:0!important;text-align:left!important;min-width:0;white-space:normal;background:none}
  table.rt td::before{content:attr(data-label);display:block;font-size:.68rem;letter-spacing:.04em;color:var(--muted);font-family:var(--f-body);font-weight:500}
  table.rt td[data-label=""]::before,table.rt td:not([data-label])::before{display:none}
  table.rt td:first-child{grid-column:1/-1}
  table.rt td:first-child::before{display:none}
  table.rt td:empty{display:none}
  table.rt td input,table.rt td select{width:100%!important}
  main table.rt tr.total{background:var(--brand-soft)}
  main table.rt tr.total td{background:none!important}
  main .tbl-wrap table:not(.rt) td:first-child{white-space:nowrap}
  main label:has(#f-format){grid-column:1/-1}
  main .cal-d{height:auto;aspect-ratio:1/1;min-height:38px}
  .panel.kpi{padding:12px;border-radius:16px}
  .kpi .kv-num{font-size:1.15rem}
  .kpi .muted{font-size:.74rem!important;line-height:1.35}
  main .panel{padding:14px}
  main .panel.kpi{padding:12px}
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  margin-left:calc(-1*max(var(--gut),env(safe-area-inset-left,0px)));margin-right:calc(-1*max(var(--gut),env(safe-area-inset-right,0px)))}
.bar-in{max-width:1440px;margin:0 auto;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandname{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.01em}
.unit{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.bar .chip{border:1px solid currentColor;opacity:.9}
.ghost{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-size:.82rem}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:transparent;border:0;color:inherit;opacity:.75;padding:8px 12px 10px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tab[aria-current="page"]{opacity:1;border-bottom-color:currentColor}

/* gate */
.gate{min-height:80vh;display:grid;place-items:center;padding-block:40px}
.gate-in{max-width:640px;width:100%;display:flex;flex-direction:column;gap:20px}
.brandpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bp{border:0;border-radius:14px;padding:24px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:140px;justify-content:flex-end}
.bp b{font-family:var(--f-display);font-size:1.35rem}
.bp-jd{background:#c8102e;color:#fff}
.bp-tsc{background:#141414;color:#d4af5a;box-shadow:inset 0 0 0 2px #b08a35}

/* generic */
main{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:9px 16px;font-weight:600}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{background:transparent;border:0;color:var(--muted);font-size:1.1rem;padding:2px 8px;border-radius:6px}
.x:hover{background:var(--soft);color:var(--bad)}
label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:500}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0;width:100%}
input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sectionlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.notice{border-radius:10px;padding:10px 14px;font-size:.88rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--brand-soft);color:var(--ink)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}

/* event list */
.evlist{display:flex;flex-direction:column;gap:10px}
.m-only{display:none!important}
.hicon{position:relative;border:0;background:transparent;color:var(--ink);width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px}
.hicon .nbadge{position:absolute;top:0;right:-2px;margin:0;min-width:18px;height:18px;font-size:.68rem;padding:0 4px}
.hk{border-radius:24px;padding:22px 18px 26px;color:var(--ink);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.hk-hero{display:flex;flex-direction:column;gap:2px}
.hk-hero .muted-l{font-size:.82rem;color:var(--muted)}
.hk-brand{font-family:var(--f-display);font-size:1.6rem;font-weight:700;background:linear-gradient(100deg,#4a63d8 0%,#a35a9a 45%,#ee8838 100%);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.hk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.hk-stats div{border-radius:14px;padding:8px 10px;min-width:0;border:1px solid var(--line)}
.hk-stats div:nth-child(1){background:#eef1fd}.hk-stats div:nth-child(2){background:#f6ecf5}.hk-stats div:nth-child(3){background:#fff1e5}
.hk-stats span{display:block;font-size:.7rem;color:var(--muted)}
.hk-stats b{font-family:var(--f-num);font-size:1rem;overflow-wrap:anywhere}
.hk-stats b.neg{color:var(--bad)}.hk-stats b.pos{color:var(--good)}
.hk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px}
.hk-tile{background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;min-width:0}
.hk-ic{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1.5px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#4a63d8,#a35a9a 50%,#ee8838) border-box;box-shadow:0 4px 14px rgba(74,99,216,.12);transition:transform .12s}
.hk-ic svg{stroke:url(#fabg)}
.hk-tile:active .hk-ic{transform:scale(.94)}
.hk-tile:hover .hk-ic{box-shadow:0 6px 18px rgba(238,136,56,.25)}
.hk-ic .nbadge{position:absolute;top:-4px;right:-6px;margin:0}
.hk-l{font-size:.84rem;line-height:1.25;text-align:center;overflow-wrap:anywhere;color:var(--ink)}
.hk-sec{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin-top:4px}
.hk-bar{width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,#4a63d8,#a35a9a 50%,#ee8838)}
.hk-next{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 14px;width:100%}
@media (min-width:821px){.hk-grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media (max-width:820px){
  .m-only{display:inline-grid!important}
  .bnav.m-only{display:grid!important}
  .m-only[hidden],.bnav.m-only[hidden]{display:none!important}
  body.has-bnav{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .bar .tabs,#switchBrand,header #logoutBtn,#roleChip{display:none!important}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(20,30,50,.08);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .bn{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;padding:6px 0 0}
  .bn.on{color:var(--brand-2);font-weight:700}
  .bn .nbadge{position:absolute;top:0;left:calc(50% + 4px);margin:0;min-width:18px;height:18px;font-size:.66rem}
  .bn-c{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--brand-2);font-size:.72rem;font-weight:700;margin-top:-26px}
  .bn-c span{width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(236,129,50,.45);border:4px solid var(--surface)}
  .bn-c em{font-style:normal}
}
.cal{display:flex;flex-direction:column;gap:10px;padding:14px;max-width:560px;width:100%}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-g .w{text-align:center;font-size:.72rem;color:var(--muted);padding-bottom:2px}
.cal-d{height:50px;border:1px solid transparent;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;color:var(--muted)}
.cal-d .n{font-size:.92rem;line-height:1}
.cal-d.has{background:var(--brand-soft);color:var(--ink);font-weight:700;cursor:pointer}
.cal-d.today{border-color:var(--brand-2)}
.cal-d.sel{background:var(--grad);color:#fff}
.cal-d .dots{display:flex;gap:2px;height:6px;align-items:center}
.cal-d .dots i,.cal-k{display:inline-block;width:6px;height:6px;border-radius:50%}
.cal-k{margin-right:5px;vertical-align:1px}
.cal-d .dots i.b,.cal-k.b{background:var(--brand-2)}
.cal-d .dots i.c,.cal-k.c{background:#2f9e6b}
.cal-d.sel .dots i{background:#fff}
.cal-d .dots b{font-size:.6rem;line-height:1}
.cal-d:disabled{cursor:default}
.ev{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.ev:hover{border-color:var(--brand-2)}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;background:var(--brand-soft);padding:8px 4px;min-height:64px}
.datebox .d{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1}
.datebox .m{font-size:.75rem;color:var(--muted)}
.ev .meta{min-width:0}
.ev .meta .t{font-weight:600}
.ev .meta .s{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.ev .amt{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.cx{background:var(--bad-soft);color:var(--bad)}
.pill.live{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--soft);color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem}
.fbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{background:var(--brand);color:var(--brand-ink);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.total td{font-weight:700;background:var(--soft)}
td input,td select{padding:5px 8px}
.line-tbl td:first-child{min-width:160px}

/* detail */
.sheet-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px}
.kv div{min-width:0}
.kv dt{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytab{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;text-align:left;font-size:.85rem}
.daytab[aria-pressed="true"]{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.daytab small{display:block;color:var(--muted);font-size:.72rem}
.pl{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.pl{grid-template-columns:1fr}}
.stmt{display:flex;flex-direction:column}
.stmt .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stmt .l.sub{padding-left:14px;color:var(--muted);font-size:.9rem}
.stmt .l.key{font-weight:700;border-bottom:2px solid var(--ink)}
.stmt .l.final{font-weight:700;font-size:1.1rem;border-bottom:0;padding-top:10px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.flag{color:var(--warn);font-size:.78rem}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pos-grid.waste .pos-tile{border-color:#e5484d55}.pos-grid.waste .pos-tile.on{background:#e5484d14;border-color:#e5484d}.pos-grid.waste .qb{background:#e5484d!important;color:#fff}
.pos-tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:84px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;font-size:.88rem;line-height:1.3}
.pos-tile:hover:not(:disabled){border-color:var(--brand-2)}
.pos-tile:active:not(:disabled){transform:scale(.97)}
.pos-tile.on{background:var(--brand-soft);border-color:var(--brand-2)}
.pos-tile .pr{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.pos-tile .qb{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--brand);color:var(--brand-ink);
  font:600 .8rem var(--f-num);display:grid;place-items:center;padding:0 6px}
.pos-tile:disabled{opacity:.6;cursor:default}
.ticket{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ticket .tr{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.ticket .tr:first-child{border-top:0}
.ticket .tr.tot{background:var(--soft);font-weight:700}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper input{width:56px;text-align:center;padding:5px 4px}
.evtabs-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,0px));z-index:4;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-block:4px 0;border-bottom:1px solid var(--line)}
.evtabs{display:flex;gap:4px;overflow-x:auto}
.evtab{flex:1 0 auto;background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;font-size:.95rem;color:var(--muted);white-space:nowrap}
.evtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-2)}
.evtab:hover{color:var(--ink)}

/* ===== FAB Hub theme: mint/lavender/peach wash, dot grid, white rounded cards, navy ink, orange gradient actions ===== */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --ink:#1b2340; --muted:#6b7285; --line:#e6e9f1; --soft:#f2f4f9;
  --brand:#ee8838; --brand-ink:#ffffff; --brand-soft:#fff1e5; --brand-2:#ee8838;
  --grad:linear-gradient(135deg,#ec8132 0%,#f3a55c 100%);
  --wash:radial-gradient(55% 45% at 0% 0%,#d7f3e6 0%,rgba(215,243,230,0) 70%),radial-gradient(55% 45% at 100% 0%,#dce5ff 0%,rgba(220,229,255,0) 70%),radial-gradient(70% 55% at 50% 105%,#fde6d6 0%,rgba(253,230,214,0) 70%);
  --dots:radial-gradient(rgba(27,35,64,.07) 1px,transparent 1.2px);
  --glass:rgba(255,255,255,.72); --shadow:0 12px 32px rgba(27,35,64,.07); --shadow-btn:0 8px 18px rgba(236,129,50,.28);
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131b; --surface:#1a1d29; --ink:#eef0f7; --muted:#9aa1b5; --line:#2a2e3d; --soft:#222636;
  --brand:#f2994f; --brand-ink:#1a1206; --brand-soft:#3a2617; --brand-2:#f2994f;
  --wash:radial-gradient(55% 45% at 0% 0%,rgba(60,140,110,.22) 0%,transparent 70%),radial-gradient(55% 45% at 100% 0%,rgba(90,110,200,.22) 0%,transparent 70%),radial-gradient(70% 55% at 50% 105%,rgba(220,120,70,.16) 0%,transparent 70%);
  --dots:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);
  --glass:rgba(26,29,41,.72); --shadow:0 12px 32px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131b; --surface:#1a1d29; --ink:#eef0f7; --muted:#9aa1b5; --line:#2a2e3d; --soft:#222636;
  --brand:#f2994f; --brand-ink:#1a1206; --brand-soft:#3a2617; --brand-2:#f2994f;
  --wash:radial-gradient(55% 45% at 0% 0%,rgba(60,140,110,.22) 0%,transparent 70%),radial-gradient(55% 45% at 100% 0%,rgba(90,110,200,.22) 0%,transparent 70%),radial-gradient(70% 55% at 50% 105%,rgba(220,120,70,.16) 0%,transparent 70%);
  --dots:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px);
  --glass:rgba(26,29,41,.72); --shadow:0 12px 32px rgba(0,0,0,.35); color-scheme:dark}
html{background:var(--bg)}
body{background:var(--wash),var(--dots) 0 0/28px 28px,var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em}
h1{font-size:1.75rem}
body::before{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar{background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .unit{color:var(--muted);opacity:1}
.brandname{font-family:var(--f-display);font-weight:700;font-size:1.25rem;background:linear-gradient(100deg,#4a63d8 0%,#a35a9a 45%,#ee8838 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);opacity:1}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 12px}
.ghost:hover{border-color:var(--brand)}
.tab{color:var(--muted);opacity:1}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.nbadge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:#e5484d;color:#fff;font:700 .78rem var(--f-num);font-variant-numeric:tabular-nums;vertical-align:2px;box-shadow:0 0 0 2px var(--surface)}
.panel,.ev,.daytab,.pos-tile,.ticket,.tbl-wrap{border-radius:20px;border-color:var(--line)}
.panel,.ev,.tbl-wrap{box-shadow:var(--shadow)}
.panel,.ev{background:var(--surface)}
.ev:hover{border-color:var(--brand);transform:translateY(-1px)}
.ev{transition:transform .15s,border-color .15s}
.datebox{border-radius:14px;background:var(--brand-soft)}
.datebox .d{color:var(--brand)}
.btn{background:var(--grad);color:#fff;border-radius:12px;box-shadow:var(--shadow-btn);padding:10px 18px}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:6px 12px;border-radius:10px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);background:var(--surface)}
.fbtn{border-radius:12px;background:var(--surface);border-color:var(--line)}
.fbtn[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--shadow-btn)}
.filters{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:5px;width:fit-content;max-width:100%}
.filters .fbtn{border-color:transparent;background:transparent}
.filters .fbtn[aria-pressed="true"]{background:var(--grad)}
th{background:var(--soft);color:var(--ink);font-weight:600}
tr.total td{background:var(--brand-soft)}
.evtabs-wrap{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:0 0 18px 18px}
.evtab{border-radius:12px 12px 0 0}
.evtab[aria-selected="true"]{border-bottom-color:var(--brand)}
.pos-tile{border-radius:16px;background:var(--surface)}
.pos-tile.on{background:var(--brand-soft);border-color:var(--brand)}
.pos-tile .qb{background:var(--grad);color:#fff}
.stepper button{border-radius:10px}
.notice{border-radius:14px}
.notice.info{background:var(--glass);border:1px solid var(--line)}
.empty{border-radius:20px;background:var(--glass)}
.gate-in{background:var(--surface);border-radius:28px;padding:36px 28px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:center}
.gate-in h1{font-size:1.6rem}
.bp{border-radius:20px;text-align:left}
.toast{border-radius:12px}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fabg" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#4a63d8"/><stop offset=".5" stop-color="#a35a9a"/><stop offset="1" stop-color="#ee8838"/></linearGradient></defs></svg>

<script>
(function(){
const BRANDS={jaedang:{name:"เจ๊แดง"},tsc:{name:"Top Secret Café"}};
const VAT=0.07;
const DEFAULT_COSTS=["ค่าแรงพนักงาน","ค่าเดินทาง/ขนส่ง","บรรจุภัณฑ์","อุปกรณ์/แก๊ส"];
const S={brand:null,view:"events",db:null,user:null,isAdmin:false,uid:null,
  events:[],menus:[],evReady:false,mnReady:false,unsub:[],
  eventId:null,day:null,pl:{},plUnsub:null,filter:"upcoming",editMenu:null,editEvent:null,draft:null,confirmDel:null};

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const fmt=(v,d=0)=>n(v).toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(a,b)=>b?fmt(a/b*100,1)+"%":"–";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const dLabel=s=>{if(!s)return"";const[y,m,d]=s.split("-");return +d+" "+TH_M[+m-1]+" "+(+y+543-2500)};
const sortedDates=e=>[...(e.dates||[])].filter(Boolean).sort();
const LOCK_DAYS=7;
const addDays=(d,k)=>{const[y,m,dd]=d.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,dd+k));return x.toISOString().slice(0,10)};
function lockInfo(e){const ds=sortedDates(e);if(!e||!ds.length||e.status==="cancelled"||e.status==="tbd")return null;const end=ds[ds.length-1],t=today();if(t<=end)return null;
  const dl=addDays(end,LOCK_DAYS),left=Math.round((Date.parse(dl)-Date.parse(t))/864e5),un=!!(e.unlockUntil&&t<=e.unlockUntil);return {end,deadline:dl,locked:t>dl&&!un,expired:t>dl,unlocked:t>dl&&un,until:e.unlockUntil||"",left}}
function unlockReq(e){const a=(S.acts||[]).filter(x=>x.eventId===e.id&&(x.type==="unlockreq"||x.type==="unlock"||x.type==="relock"));const last=a.sort((x,y)=>String(y.at).localeCompare(String(x.at)))[0];return last&&last.type==="unlockreq"?last:null}
function dateRanges(list){
  const ds=[...new Set(list.filter(Boolean))].sort(),out=[];
  const next=s=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)};
  ds.forEach(d=>{const r=out[out.length-1];if(r&&next(r[1])===d)r[1]=d;else out.push([d,d])});
  return out;
}
function rangeLabel([a,b]){
  if(a===b)return dLabel(a);
  const[ya,ma,da]=a.split("-"),[yb,mb,db]=b.split("-"),yy=y=>(+y+543-2500);
  if(ya===yb&&ma===mb)return `${+da}–${+db} ${TH_M[+ma-1]} ${yy(ya)}`;
  if(ya===yb)return `${+da} ${TH_M[+ma-1]}–${+db} ${TH_M[+mb-1]} ${yy(ya)}`;
  return `${dLabel(a)}–${dLabel(b)}`;
}
const timeText=e=>!e.serveFrom?"–":e.serveTo?`${esc(e.serveFrom)}–${esc(e.serveTo)} น.`:`${esc(e.serveFrom)} น.`;
const datesText=list=>dateRanges(list).map(rangeLabel).join(", ");
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- money ---------- */
function eventTotal(e){
  const days=sortedDates(e).length||1;
  if(e.format==="Booth")return n(e.feas?.salesPerDay)*days;
  const pk=(e.packages||[]).reduce((a,p)=>a+n(p.price)*n(p.qty),0);
  return pk+n(e.cateringFeePerDay)*days;
}
/* Booth fixed cost (from Fixed_Cost_Booth.xlsx) */
const FC_DEFAULT={foodPct:0.355,wage:550,otHours:4,otRate:1.5,allowance:200,hotelRoom:1000,perRoom:2,transport:1500,other:500};
const FC_ROWS=[["foodPct","ต้นทุนอาหาร (% ของยอดขาย)","%","โดยประมาณ"],["wage","ค่าแรง","บาท/คน/วัน","โดยเฉลี่ย"],
  ["otHours","OT","ชม./คน/วัน","ตามที่ร้านกำหนด"],["otRate","อัตรา OT","เท่าของค่าแรงรายชั่วโมง","1.5 เท่าตามกฎหมายแรงงาน"],
  ["allowance","เบี้ยเลี้ยง","บาท/คน/วัน","ตามที่ร้านกำหนด"],["hotelRoom","ค่าที่พัก","บาท/ห้อง/คืน","คิดทุกคืนเท่ากับจำนวนวันงาน"],
  ["perRoom","พักห้องละ","คน","ตามที่ร้านกำหนด"],["transport","ค่ารถขนส่ง","บาท/งาน","โดยประมาณ"],["other","ค่าอื่น ๆ","บาท/งาน","ค่าน้ำแข็ง, ค่าขนส่งของระหว่างวัน"]];
const fcNow=()=>({...FC_DEFAULT,...(S.fc||{})});
const INLINE_FC_BRANDS=["tsc"];
const inlineFc=()=>INLINE_FC_BRANDS.includes(S.brand);
const blankFc=()=>Object.fromEntries(FC_ROWS.map(([k])=>[k,null]));
const formFc=e=>inlineFc()?(e.feasFc||blankFc()):fcNow();
const fcMissing=()=>!S.fc||FC_ROWS.some(([k])=>S.fc[k]===null||S.fc[k]===undefined||S.fc[k]==="");
const TSC_LINES=[["personnel","ค่าใช้จ่ายบุคลากร / COL / ที่พัก / น้ำมันรถ"],["rent","ค่าเช่าพื้นที่บูธ"],["setup","Set up / ก่อสร้างติดตั้งสถานที่บูธ"],["pos","ค่าเช่า POS"],["coffee","ค่าเช่าเครื่องกาแฟ"],["media","ค่าผลิตสื่อตกแต่งบูธ"],["carRent","ค่าเช่ารถ"],["transport","ค่ารถขนของ"]];
function calcFeasLines(e){
  const fe=e.feas||{},L=fe.lines||{},days=sortedDates(e).length||1,vatIn=e.vatIncluded!==false;
  const gross=n(fe.salesPerDay)*days,net=vatIn?gross/(1+VAT):gross,fp=n(fe.foodPct),food=net*fp;
  const items=TSC_LINES.map(([k,l])=>({k,l,v:n(L[k])})),fixed=items.reduce((a,x)=>a+x.v,0),gp=net-food,np=gp-fixed;
  const beNet=fp<1?fixed/(1-fp):0,beGross=vatIn?beNet*(1+VAT):beNet;
  return {lines:true,items,days,staff:0,vatIn,gross,vat:gross-net,net,food,foodPct:fp,fixed,gp,np,rent:n(L.rent),beGross,beDay:beGross/days,f:{foodPct:fp}};
}
function calcFeas(e,fcOverride){
  if(e.feas&&e.feas.lines)return calcFeasLines(e);
  const f={...FC_DEFAULT,...(fcOverride||e.feasFc||S.fc||{})},fe=e.feas||{},days=sortedDates(e).length||1,staff=n(fe.staff);
  const vatIn=e.vatIncluded!==false,gross=n(fe.salesPerDay)*days,net=vatIn?gross/(1+VAT):gross;
  const food=net*n(f.foodPct),otHr=n(f.wage)/8*n(f.otRate);
  const labor=staff*n(f.wage)*days,ot=staff*n(f.otHours)*otHr*days,allow=staff*n(f.allowance)*days;
  const rooms=fe.stay?Math.ceil(staff/(n(f.perRoom)||1)):0,hotel=rooms*n(f.hotelRoom)*days;
  const transport=n(f.transport),other=n(f.other),rent=n(fe.rent);
  const fixed=labor+ot+allow+hotel+transport+other+rent,gp=net-food,np=gp-fixed;
  const beNet=n(f.foodPct)<1?fixed/(1-n(f.foodPct)):0,beGross=vatIn?beNet*(1+VAT):beNet;
  return {days,staff,vatIn,gross,vat:gross-net,net,food,otHr,labor,ot,allow,rooms,hotel,transport,other,rent,fixed,gp,np,beGross,beDay:beGross/days,f};
}
function feasPanel(e,c){
  if(c.lines){
    const ok=c.np>0,label=!c.gross?"ยังไม่ได้ใส่ Target sales":ok?"ผ่าน · มีกำไร":"ไม่ผ่าน · ขาดทุน";
    const R=(t,v,p,cls="")=>`<div class="l ${cls}"><span>${t}</span><span class="num">${v}${p!==undefined?` <small class="muted">${pct(p,c.net)}</small>`:""}</span></div>`;
    return `<div class="pl"><div class="panel stmt">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="sectionlabel">Budget · ${c.days} วัน</span><span class="pill ${!c.gross?"done":ok?"ok":"cx"}">${label}</span></div>
      ${R("Sales (Target"+(c.vatIn?" inc. VAT":"")+")",fmt(c.gross,2))}
      ${c.vatIn?R("หัก VAT 7%","("+fmt(c.vat,2)+")",undefined,"sub"):""}
      ${R("ยอดขายก่อน VAT",fmt(c.net,2),undefined,"key")}
      ${R("Food cost","("+fmt(c.food,2)+")",c.food)}
      ${c.items.map(x=>R(esc(x.l),x.v?"("+fmt(x.v,2)+")":"–",x.v,"sub")).join("")}
      ${R("Total Cost","("+fmt(c.food+c.fixed,2)+")",c.food+c.fixed,"key")}
      <div class="l final"><span>Profit &amp; Loss</span><span class="num ${c.np<0?"neg":"pos"}">${fmt(c.np,2)} <small class="muted">${pct(c.np,c.net)}</small></span></div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="sectionlabel">จุดคุ้มทุน</div>
      <div><div class="num" style="font-size:1.4rem;font-weight:600">฿${fmt(c.beDay)}<span class="muted" style="font-size:.85rem"> /วัน</span></div>
      <div class="muted" style="font-size:.85rem">ยอดขายขั้นต่ำ${c.vatIn?" (inc. VAT)":""} ทั้งงาน ฿${fmt(c.beGross)}</div></div></div></div>`;
  }
  const ok=c.np>0,label=!c.gross?"ยังไม่ได้ใส่ยอดขาย":ok?"ผ่าน · มีกำไร":"ไม่ผ่าน · ขาดทุน";
  const L=(t,v,cls="",note="")=>`<div class="l ${cls}"><span>${t}${note?` <small class="muted">${note}</small>`:""}</span><span class="num">${v}</span></div>`;
  return `<div class="pl">
  <div class="panel stmt">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="sectionlabel">P&amp;L Feasibility · ${c.days} วัน</span><span class="pill ${!c.gross?"done":ok?"ok":"cx"}">${label}</span></div>
    ${L("Target sales"+(c.vatIn?" (รวม VAT)":""),fmt(c.gross,2),"",`${fmt(c.gross/c.days)}/วัน`)}

function menuCost(m){return (m?.bom||[]).reduce((a,b)=>a+n(b.qty)*n(b.unitCost),0)}
function menuFor(line){return S.menus.find(m=>m.id===line.menuId)||S.menus.find(m=>m.name===line.name)}
function defaultPL(e){
  const days=sortedDates(e).length||1;
  if(e.format==="Booth"){
    const c=calcFeas(e),r=v=>Math.round(v/days*100)/100;
    if(c.lines)return {sales:[],cateringFee:0,otherCosts:c.items.map(x=>({label:x.l,amount:r(x.v)})),saved:false};
    return {sales:(e.packages||[]).map(p=>({menuId:p.menuId||"",name:p.name,price:n(p.price),qty:Math.round(n(p.qty)/days)})),cateringFee:0,
      otherCosts:[["ค่าแรง",c.labor],["OT",c.ot],["เบี้ยเลี้ยง",c.allow],["ค่าที่พัก",c.hotel],["ค่าเช่าบูธ",c.rent],["ค่ารถขนส่ง",c.transport],["ค่าอื่น ๆ (น้ำแข็ง ฯลฯ)",c.other]]
        .map(([l,v])=>({label:l,amount:r(v)})),saved:false};
  }
  return {sales:(e.packages||[]).map(p=>({menuId:p.menuId||"",name:p.name,price:n(p.price),qty:Math.round(n(p.qty)/days)})),
    cateringFee:n(e.cateringFeePerDay),otherCosts:DEFAULT_COSTS.map(l=>({label:l,amount:0})),saved:false};
}
/* Catering: sales fixed by the confirmation, split across event days (remainder on the last day) */
function cateringDay(e,d){
  const ds=sortedDates(e),days=ds.length||1,last=ds[ds.length-1]===d;
  if(d==="event")return {sales:(e.packages||[]).map(p=>({menuId:p.menuId||"",name:p.name,price:n(p.price),qty:n(p.qty)})),cateringFee:n(e.cateringFeePerDay)*days};
  return {sales:(e.packages||[]).map(p=>{const base=Math.floor(n(p.qty)/days);
    return {menuId:p.menuId||"",name:p.name,price:n(p.price),qty:last?n(p.qty)-base*(days-1):base}}),cateringFee:n(e.cateringFeePerDay)};
}
const fmt0=v=>String(n(v));
function boothMenus(){
  const b=S.menus.filter(m=>(m.channel||[]).includes("booth"));
  return (b.length?b:S.menus).slice().sort((x,y)=>String(x.name).localeCompare(String(y.name),"th"));
}
function effPL(e,d,pl){return e.format==="Booth"?pl:{...pl,...cateringDay(e,d)}}
function calcPL(e,pl){
  const gross=(pl.sales||[]).reduce((a,s)=>a+n(s.price)*n(s.qty),0)+n(pl.cateringFee);
  const vatIn=e.vatIncluded!==false;
  const net=vatIn?gross/(1+VAT):gross;
  let cogs=0,missing=[];
  (pl.sales||[]).forEach(s=>{const has=s.unitCogs!==undefined&&s.unitCogs!==null&&s.unitCogs!=="";const c=has?n(s.unitCogs):menuCost(menuFor(s));if(n(s.qty)>0&&!has&&!c)missing.push(s.name);cogs+=c*n(s.qty)});
  const cogsSales=cogs;let waste=0;
  (pl.waste||[]).forEach(w=>{const has=w.unitCogs!==undefined&&w.unitCogs!==null&&w.unitCogs!=="";const c=has?n(w.unitCogs):menuCost(menuFor(w));if(n(w.qty)>0&&!c&&!missing.includes(w.name))missing.push(w.name);waste+=c*n(w.qty)});
  cogs+=waste;
  const other=(pl.otherCosts||[]).reduce((a,c)=>a+n(c.amount),0);
  const gp=net-cogs,np=gp-other;
  return {gross,vat:gross-net,net,cogs,cogsSales,waste,gp,other,np,missing};
}
function eventStatus(e){
  if(e.status==="cancelled")return["cx","ยกเลิก"];
  if(e.status==="tbd")return["live","รอกำหนดวัน"];
  const ds=sortedDates(e),t=today();
  if(!ds.length)return["ok","คอนเฟิร์มแล้ว"];
  if(t>ds[ds.length-1])return["done",t>addDays(ds[ds.length-1],LOCK_DAYS)&&!(e.unlockUntil&&t<=e.unlockUntil)?"🔒 ปิดงานแล้ว":"จบงานแล้ว"];
  if(t>=ds[0])return["live","กำลังจัดงาน"];
  return["ok","คอนเฟิร์มแล้ว"];
}

/* ---------- platform ---------- */
async function boot(){
  S.members={};S.accessReady=false;showGate();
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    S.db=db;S.user=user;
    if(user){S.isOwner=await user.isOwner();S.levelAdmin=await user.canEdit();S.uid=await user.id()}
  }catch(e){}
  claude.use("downloads").then(d=>{S.downloads=d;if(S.brand)rerender()}).catch(()=>{});
  claude.use("assets").then(a=>{S.assets=a;if(S.view==="event"||S.view==="new")rerender()}).catch(()=>{});
  S.platformReady=true;
  if(!S.db||!S.uid){S.accessReady=true;showGate();return}
  S.db.doc("access/members").onSnapshot(d=>{S.members=(d.exists&&d.data().members)||{};S.accessReady=true;applyAccess()},
    ()=>{S.accessReady=true;applyAccess()});
}
function allowedBrands(){
  if(S.isOwner||myRole()==="management")return Object.keys(BRANDS);
  const m=S.uid&&S.members[S.uid];return m?(m.brands||[]).filter(b=>BRANDS[b]):[];
}
function myRole(){if(S.isOwner)return"owner";const m=S.uid&&S.members[S.uid];return m?m.role:null}
function applyAccess(){
  const al=allowedBrands(),role=myRole();
  S.isSys=S.isOwner||(role==="sysadmin"&&!!S.levelAdmin);
  S.isAdmin=S.isSys||((role==="admin"||role==="register")&&!!S.levelAdmin);
  S.canSales=S.isSys||((role==="admin"||role==="sales")&&!!S.levelAdmin);
  if(S.brand&&al.includes(S.brand)){rerender();return}
  if(S.brand)leaveBrand();
  const saved=ls("bc.brand");
  if(al.length===1)enterBrand(al[0]);
  else if(saved&&al.includes(saved))enterBrand(saved);
  else showGate();
}
function leaveBrand(){S.unsub.forEach(u=>u());S.unsub=[];if(S.plUnsub)S.plUnsub();if(S.upUnsub)S.upUnsub();if(S.payUnsub)S.payUnsub();S.brand=null}

function subscribe(){

  S.reads={};S.unsub.push(S.db.collection("reads").onSnapshot(q=>{const r={};q.docs.forEach(d=>r[d.id]=d.data());S.reads=r;rerender()},()=>{}));
  S.unsub.push(S.db.doc(base+"/settings/booth").onSnapshot(d=>{S.fc=d.exists?d.data():null;S.fcReady=true;rerender()},()=>{S.fcReady=true}));

    if(S.view==="event")rerender();

/* events list */
function viewEvents(){
  const t=today();
  let list=[...S.events].sort((a,b)=>(sortedDates(a)[0]||"").localeCompare(sortedDates(b)[0]||""));
  const counts={upcoming:0,past:0,all:list.length};
  list.forEach(e=>{const ds=sortedDates(e);(ds.length&&ds[ds.length-1]<t)?counts.past++:counts.upcoming++});
  if(S.calDay)list=list.filter(e=>e.status!=="cancelled"&&sortedDates(e).includes(S.calDay));
  else if(S.filter==="upcoming")list=list.filter(e=>{const ds=sortedDates(e);return !ds.length||ds[ds.length-1]>=t});
  else if(S.filter==="past")list=list.filter(e=>{const ds=sortedDates(e);return ds.length&&ds[ds.length-1]<t}).reverse();
  const head=`<div class="row" style="justify-content:space-between">
    <h1>งานที่คอนเฟิร์มแล้ว</h1>
    <div class="row">${S.downloads&&S.events.length?`<button class="btn sec" id="pdfAll" type="button">Export PDF สรุปงาน</button>`:""}${S.isAdmin?`<button class="btn" data-view="new" type="button">+ ลงทะเบียนงาน</button>`:""}</div></div>

      :`<div class="filters">${[["upcoming","กำลังจะถึง"],["past","จบแล้ว"],["all","ทั้งหมด"]].map(([k,l])=>`<button class="fbtn" data-filter="${k}" aria-pressed="${S.filter===k}" type="button">${l} <span class="num">${counts[k]}</span></button>`).join("")}</div>`}</div>`;
  if(!S.evReady)return head+`<div class="empty">กำลังโหลดรายการงาน…</div>`;

  return head+`<div class="evlist">${list.map(e=>{
    const ds=sortedDates(e),[cls,lab]=eventStatus(e),f=ds[0];

      <div class="meta"><div class="t">${esc(e.customer)} · ${esc(e.venue)}</div>
        <div class="s">${esc(e.format)} · ${datesText(ds)}${ds.length>1?` (${ds.length} วัน)`:""} · ${timeText(e)}${isBooth(e)?"":` · ${fmt(e.guests)} ท่าน`}</div></div>
      <div class="amt">${cls==="done"?(e.actual&&n(e.actual.days)?`<div class="sectionlabel" style="font-size:.66rem">ยอดขาย (inc. VAT)</div><div class="num" style="font-weight:600">฿${fmt(e.actual.gross)}</div>
        <div class="num ${n(e.actual.np)<0?"neg":"pos"}" style="font-size:.85rem;font-weight:600">${n(e.actual.np)<0?"ขาดทุน":"กำไร"} ฿${fmt(Math.abs(n(e.actual.np)))}</div>`
        :`<div class="sectionlabel" style="font-size:.66rem">ยอดขาย (inc. VAT)</div><div class="muted" style="font-size:.85rem">ยังไม่กรอกยอด</div>`)
      :`${isBooth(e)?`<div class="sectionlabel" style="font-size:.66rem">Target sales</div>`:""}<div class="num" style="font-weight:600">฿${fmt(eventTotal(e))}</div>`}<span class="pill ${cls}">${lab}</span></div>

/* event calendar */
function calView(){
  const ym=S.calMonth||(S.calMonth=today().slice(0,7)),[y,m]=ym.split("-").map(Number),t=today();
  const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),days=new Date(Date.UTC(y,m,0)).getUTCDate();
  const map={};S.events.filter(e=>e.status!=="cancelled").forEach(e=>sortedDates(e).forEach(d=>{if(d.startsWith(ym))(map[d]||(map[d]=[])).push(e)}));
  const cells=[];for(let i=0;i<first;i++)cells.push(`<span></span>`);
  for(let d=1;d<=days;d++){const k=ym+"-"+String(d).padStart(2,"0"),ev=map[k]||[],sel=S.calDay===k;
    cells.push(`<button type="button" class="cal-d${ev.length?" has":""}${k===t?" today":""}${sel?" sel":""}" ${ev.length?`data-calday="${k}"`:"disabled"} aria-pressed="${sel}" aria-label="${d} ${TH_MF[m-1]}${ev.length?` มี ${ev.length} งาน`:""}">
      <span class="n">${d}</span><span class="dots">${ev.slice(0,3).map(e=>`<i class="${isBooth(e)?"b":"c"}"></i>`).join("")}${ev.length>3?`<b>+${ev.length-3}</b>`:""}</span></button>`)}
  const cnt=Object.keys(map).length;
  return `<section class="panel cal" aria-label="ปฏิทินงาน">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
      <button class="btn sec small" data-calm="-1" type="button" aria-label="เดือนก่อน">‹</button>
      <div style="text-align:center"><b>${TH_MF[m-1]} ${y+543}</b><div class="muted" style="font-size:.78rem">${cnt?`มีงาน ${cnt} วัน`:"ไม่มีงานเดือนนี้"}</div></div>
      <button class="btn sec small" data-calm="1" type="button" aria-label="เดือนถัดไป">›</button></div>
    <div class="cal-g">${["อา","จ","อ","พ","พฤ","ศ","ส"].map(w=>`<span class="w">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="row muted" style="gap:14px;font-size:.78rem;justify-content:center"><span><i class="cal-k b"></i>บูธ</span><span><i class="cal-k c"></i>Catering</span>${ym!==t.slice(0,7)?`<button class="btn sec small" data-caltoday type="button">วันนี้</button>`:""}</div>
  </section>`;
}

async function htmlToPdf(html,filename,btn,label,landscape){
  btn.disabled=true;btn.textContent="กำลังสร้าง PDF…";
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const W=landscape?1123:794,pw=landscape?297:210,ph=landscape?210:297;
    const host=document.createElement("div");
    host.style.cssText=`position:absolute;left:-10000px;top:0;width:${W}px;background:#ffffff;color:#1b1a19;font-family:var(--f-body);font-size:13px;line-height:1.5;`+PDF_BASE+(PDF_VARS[S.brand]||"");
    host.innerHTML=html;document.body.appendChild(host);
    try{await document.fonts.ready}catch(_){}
    const canvas=await window.html2canvas(host,{scale:2,backgroundColor:"#ffffff"});host.remove();
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:landscape?"landscape":"portrait"}),pxmm=canvas.width/pw,pageH=Math.floor(ph*pxmm);
    for(let y=0,i=0;y<canvas.height;y+=pageH,i++){
      const c=document.createElement("canvas");c.width=canvas.width;c.height=Math.min(pageH,canvas.height-y);
      const g=c.getContext("2d");g.fillStyle="#ffffff";g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,y,c.width,c.height,0,0,c.width,c.height);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,c.height/pxmm);
    }
    await S.downloads.save({filename,data:pdf.output("blob")});toast("บันทึก PDF แล้ว");
  }catch(x){if(x?.code!=="declined")toast(x?.code==="unavailable"?"หน้านี้บันทึกไฟล์ไม่ได้":"สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง")}
  finally{btn.disabled=false;btn.textContent=label}
}

      const sub=ev.submitter||$("#evForm button[type=submit]");if(sub){sub.disabled=true;sub.textContent="กำลังบันทึก…"}
      if(await write(()=>ref.set(body),S.editEvent?"บันทึกการแก้ไขแล้ว":"ยืนยันงานแล้ว")){
        logAct(S.editEvent?"edit":"new",{id:ref.id,...body},`${body.format} · ${datesText(body.dates)} · ${body.venue}`);
        S.events=S.events.filter(x=>x.id!==ref.id).concat([{id:ref.id,...body}]);
        const f=!booth&&S.slipFile,sl={amount:0,date:today(),time:"",payer:"",bank:"",ref:"",kind:""};
        if(f&&S.assets){try{
          const up=await S.assets.upload(f,f.type?undefined:{type:/\.pdf$/i.test(f.name)?"application/pdf":"image/jpeg"});
          const pay={assetId:up.id,contentType:up.contentType,amount:n(sl.amount),date:sl.date,time:sl.time||"",payer:sl.payer||"",bank:sl.bank||"",ref:sl.ref||"",kind:sl.kind||"",by:S.uid||"",at:new Date().toISOString()};
          await S.db.collection(base+"/events/"+ref.id+"/payments").doc().set(pay);
          logAct("slip",{id:ref.id,...body},"แนบสลิป");toast("ยืนยันงานและแนบสลิปแล้ว");
        }catch(x){toast("บันทึกงานแล้ว แต่แนบสลิปไม่สำเร็จ แนบใหม่ได้ในหน้างาน")}}
        S.slipFile=null;go("event",{id:ref.id})}
      else if(sub){sub.disabled=false;sub.textContent=S.editEvent?"บันทึกการแก้ไข":"ยืนยันงาน"}
    });
  }

  /* event sheet */
  if(S.view==="event"){
    const e=S.events.find(x=>x.id===S.eventId);
    fillNames();
    on("[data-evtab]","click",ev=>{rerender();S.evTab=ev.currentTarget.dataset.evtab;render();window.scrollTo(0,0)});
    on("[data-day]","click",ev=>{S.draft=null;S.day=ev.currentTarget.dataset.day;render()});
    const syncPaid=async()=>{return;const paid=(S.payments||[]).reduce((a,p)=>a+n(p.amount),0);
      try{await S.db.doc(base+"/events/"+e.id).update({paid})}catch(_){}};
    if($("#payNew"))$("#payNew").onclick=()=>{S.payOpen=true;S.payDraft=null;rerender()};
    if($("#payCancel"))$("#payCancel").onclick=()=>{S.payOpen=false;S.payDraft=null;rerender()};
    on("[data-slip]","click",ev=>{const p=S.payments.find(x=>x.id===ev.currentTarget.dataset.slip);if(!p)return;
      if(p.contentType==="application/pdf")return;S.slipView=S.slipView===p.assetId?null:p.assetId;rerender()});
    if($("#slipClose"))$("#slipClose").onclick=()=>{S.slipView=null;rerender()};
    if($("#p-file"))$("#p-file").addEventListener("change",async ev=>{
      const f=ev.target.files[0];if(!f)return;
      if(f.size>20*1024*1024){toast("ไฟล์ใหญ่เกิน 20 MB");return}
      S.payBusy=true;render();
      try{
        const up=await S.assets.upload(f,f.type?undefined:{type:/\.pdf$/i.test(f.name)?"application/pdf":"image/jpeg"});
        const body={assetId:up.id,contentType:up.contentType,amount:0,date:today(),time:"",payer:"",bank:"",ref:"",kind:"",by:S.uid||"",at:new Date().toISOString()};
        const ref=S.db.collection(base+"/events/"+e.id+"/payments").doc();
        if(await write(()=>ref.set(body),"แนบสลิปแล้ว")){logAct("slip",e,"แนบสลิป");S.payments=[...(S.payments||[]),{id:ref.id,...body}]}
      }catch(x){toast(x?.code==="unsupported_type"?"รองรับเฉพาะรูป PNG/JPG/WEBP หรือ PDF":x?.code==="too_large"?"ไฟล์ใหญ่เกินกำหนด":"แนบสลิปไม่สำเร็จ ลองใหม่อีกครั้ง")}
      S.payBusy=false;rerender();
    });
    on("[data-paydel]","click",ev=>{S.payDel=ev.currentTarget.dataset.paydel;rerender()});
    on("[data-paydelno]","click",()=>{S.payDel=null;rerender()});
    on("[data-paydelyes]","click",async ev=>{const id=ev.currentTarget.dataset.paydelyes,p=S.payments.find(x=>x.id===id);
      if(await write(()=>S.db.doc(base+"/events/"+e.id+"/payments/"+id).delete(),"ลบสลิปแล้ว")){
        if(p&&S.assets){try{await S.assets.delete(p.assetId)}catch(_){}}
        S.payments=S.payments.filter(x=>x.id!==id);S.payDel=null;await syncPaid();rerender()}});
    if($("#upNew"))$("#upNew").onclick=()=>{S.upOpen=true;S.upDraft={type:UP_TYPES[0]};rerender()};
    if($("#upCancel"))$("#upCancel").onclick=()=>{S.upOpen=false;S.upDraft=null;rerender()};
    if($("#upSave"))$("#upSave").onclick=async()=>{readUp();const u=S.upDraft||{};
      if(!String(u.body||"").trim()){toast("พิมพ์ข้อความก่อนโพสต์");return}
      const body={title:"",type:"",due:"",body:u.body.trim(),by:S.uid||"",at:new Date().toISOString()};
      if(await write(()=>S.db.collection(base+"/events/"+e.id+"/updates").doc().set(body),"โพสต์อัปเดตแล้ว")){logAct("update",e,String(body.body).slice(0,120));S.upDraft=null;render()}};
    on("[data-updel]","click",ev=>{S.upDel=ev.currentTarget.dataset.updel;rerender()});
    on("[data-updelno]","click",()=>{S.upDel=null;rerender()});
    on("[data-updelyes]","click",async ev=>{const id=ev.currentTarget.dataset.updelyes;if(await write(()=>S.db.doc(base+"/events/"+e.id+"/updates/"+id).delete(),"ลบอัปเดตแล้ว")){S.upDel=null;rerender()}});
    if($("#pdfEv"))$("#pdfEv").onclick=ev=>exportPDF(e,ev.currentTarget);
    if($("#pdfPL"))$("#pdfPL").onclick=ev=>htmlToPdf(plSheet(e),"PL_"+(safeName(e.customer)||"event")+"_"+(sortedDates(e)[0]||"")+".pdf",ev.currentTarget,"Export PDF",false);
    if($("#editEv"))$("#editEv").onclick=()=>go("new",{event:e});
    if($("#delEv"))$("#delEv").onclick=()=>{S.confirmDel=e.id;render()};
    if($("#delNo"))$("#delNo").onclick=()=>{S.confirmDel=null;render()};
    if($("#delYes"))$("#delYes").onclick=async()=>{if(await write(()=>S.db.doc(base+"/events/"+e.id).delete(),"ลบงานแล้ว")){logAct("del",e,datesText(sortedDates(e)));go("events")}};
    const rr=()=>{readPL();S.draft._dirty=true;S.draft._dirty=true;render()};
    on(".pl input,.pl select","change",rr);
    if($("#addSl"))$("#addSl").onclick=()=>{readPL();S.draft._dirty=true;S.draft._dirty=true;S.draft.sales.push({menuId:"",name:"",price:0,qty:0});render()};
    on("[data-pos-add]","click",ev=>{readPL();const id=ev.currentTarget.dataset.posAdd,m=S.menus.find(x=>x.id===id);if(!m)return;
      const W=S.posMode==="waste"&&ev.currentTarget.classList.contains("pos-tile"),arr=W?(S.draft.waste||(S.draft.waste=[])):S.draft.sales;
      const l=arr.find(x=>x.menuId===id);if(l)l.qty=n(l.qty)+1;else arr.push({menuId:m.id,name:m.name,price:n(m.price),qty:1});
      S.draft._dirty=true;render()});
    on("[data-posmode]","click",ev=>{readPL();S.posMode=ev.currentTarget.dataset.posmode;render()});
    on("[data-waste-add]","click",ev=>{readPL();const l=(S.draft.waste||[]).find(x=>x.menuId===ev.currentTarget.dataset.wasteAdd);if(l){l.qty=n(l.qty)+1;S.draft._dirty=true;render()}});
    on("[data-waste-dec]","click",ev=>{readPL();const l=(S.draft.waste||[]).find(x=>x.menuId===ev.currentTarget.dataset.wasteDec);if(!l)return;l.qty=n(l.qty)-1;S.draft.waste=S.draft.waste.filter(x=>n(x.qty)>0);S.draft._dirty=true;render()});
    on("[data-pos-dec]","click",ev=>{readPL();const id=ev.currentTarget.dataset.posDec,l=S.draft.sales.find(x=>x.menuId===id);if(!l)return;
      l.qty=n(l.qty)-1;S.draft.sales=S.draft.sales.filter(x=>n(x.qty)>0);S.draft._dirty=true;render()});
    on("[data-delsl]","click",ev=>{readPL();S.draft._dirty=true;S.draft.sales.splice(+ev.currentTarget.dataset.delsl,1);render()});
    if($("#addOc"))$("#addOc").onclick=()=>{readPL();S.draft._dirty=true;S.draft.otherCosts.push({label:"",amount:0});render()};
    on("[data-deloc]","click",ev=>{readPL();S.draft._dirty=true;S.draft.otherCosts.splice(+ev.currentTarget.dataset.deloc,1);render()});
    if($("#savePL"))$("#savePL").onclick=async()=>{readPL();const p=S.draft,d=S.day;
      const ef=effPL(e,d,p);
      const body={sales:ef.sales.filter(s=>s.name||s.menuId),waste:(p.waste||[]).filter(w=>n(w.qty)>0).map(w=>({menuId:w.menuId,name:w.name,qty:n(w.qty),unitCogs:+menuCost(menuFor(w)).toFixed(4)})),cateringFee:n(ef.cateringFee),otherCosts:p.otherCosts.filter(o=>o.label||n(o.amount)),updatedBy:S.uid||"",updatedAt:new Date().toISOString()};
      if(await write(()=>S.db.doc(base+"/events/"+e.id+"/pl/"+d).set(body),"บันทึก P&L "+(d==="event"?"ทั้งงาน":dLabel(d))+" แล้ว")){S.pl[d]=body;S.draft=null;
        const r2=v=>Math.round(v*100)/100,act={gross:0,net:0,cogs:0,np:0,days:0,byMonth:{},byDay:{}};
        Object.entries(S.pl).forEach(([k,v])=>{const c=calcPL(e,effPL(e,k,v)),dk=k==="event"?(sortedDates(e)[0]||""):k,ym=dk.slice(0,7);
          const m=act.byMonth[ym]||(act.byMonth[ym]={gross:0,net:0,cogs:0,np:0,days:0});
          const dd=act.byDay[dk]||(act.byDay[dk]={gross:0,net:0,cogs:0,np:0,days:0});
          for(const o of[act,m,dd]){o.gross+=c.gross;o.net+=c.net;o.cogs+=c.cogs;o.np+=c.np;o.days++}});
        for(const o of[act,...Object.values(act.byMonth),...Object.values(act.byDay)])for(const k of["gross","net","cogs","np"])o[k]=r2(o[k]);
        try{await S.db.doc(base+"/events/"+e.id).update({actual:act})}catch(_){}
        {const c=calcPL(e,effPL(e,d,body));logAct("pl",e,`${d==="event"?"ทั้งงาน":dLabel(d)} · ยอดขาย ฿${fmt(c.gross)} · ${c.np<0?"ขาดทุน":"กำไร"} ฿${fmt(Math.abs(c.np))}`)}
        render()}};
  }

  /* users */
  if(S.view==="users"&&S.isSys){
    fillNames();
    const clone=()=>JSON.parse(JSON.stringify(S.members));
    const box=$("#uResults"),inp=$("#uSearch");
    const show=async q=>{if(!S.user)return;const hits=await S.user.search(q);
      box.innerHTML="";hits.filter(h=>!S.members[h.id]&&h.id!==S.uid).forEach(h=>{
        const b=document.createElement("button");b.type="button";b.className="btn sec small";b.style.textAlign="left";
        b.textContent="+ "+h.name+(h.email?" · "+h.email:"");
        b.onclick=()=>{const nx=clone();nx[h.id]={brands:[S.brand],role:"viewer"};inp.value="";box.innerHTML="";saveMembers(nx,"เพิ่มผู้ใช้แล้ว")};
        box.appendChild(b)});
      if(q&&!box.children.length)box.innerHTML=`<span class="muted">ไม่พบผู้ใช้</span>`};
    inp.addEventListener("focus",()=>show(inp.value));
    inp.addEventListener("input",()=>show(inp.value));
    on("[data-ub]","change",ev=>{const id=ev.target.dataset.ub,b=ev.target.dataset.brand,nx=clone();
      const set=new Set(nx[id].brands||[]);ev.target.checked?set.add(b):set.delete(b);nx[id].brands=[...set];saveMembers(nx,"อัปเดตแบรนด์แล้ว")});
    on("[data-ur]","change",ev=>{const nx=clone();nx[ev.target.dataset.ur].role=ev.target.value;saveMembers(nx,"อัปเดตสิทธิ์แล้ว")});
    on("[data-urm]","click",ev=>{S.confirmDel="u:"+ev.currentTarget.dataset.urm;render()});
    on("[data-urmyes]","click",ev=>{const nx=clone();delete nx[ev.currentTarget.dataset.urmyes];saveMembers(nx,"ลบผู้ใช้แล้ว")});
  }

  /* menus */
  if(S.view==="menus"){
    if($("#saveFc"))$("#saveFc").onclick=async()=>{
      const body={};FC_ROWS.forEach(([k])=>{const raw=$("#fc-"+k).value.trim();if(raw===""){body[k]=null;return}const v=n(raw);body[k]=k==="foodPct"?v/100:v});
      if(body.foodPct!==null&&!(body.foodPct<1)){toast("ต้นทุนอาหารต้องน้อยกว่า 100%");return}
      body.updatedAt=new Date().toISOString();
      if(await write(()=>S.db.doc(base+"/settings/booth").set(body),"บันทึก Fixed cost แล้ว")){S.fc=body;render()}};
    on("[data-editmenu]","click",ev=>{S.draft=null;S.editMenu=ev.currentTarget.dataset.editmenu;render()});
    if($("#newMenu"))$("#newMenu").onclick=()=>{S.draft=null;S.editMenu="new";render()};
    if($("#m-name")){
      on(".panel input","change",()=>{readMenu();render()});
      if($("#addBom"))$("#addBom").onclick=()=>{readMenu();S.draft.bom.push({ingredient:"",qty:1,unit:"",unitCost:0});render()};
      on("[data-delbom]","click",ev=>{readMenu();S.draft.bom.splice(+ev.currentTarget.dataset.delbom,1);render()});
      $("#closeMenu").onclick=()=>{S.draft=null;S.editMenu=null;S.confirmDel=null;render()};
      if($("#delMenu"))$("#delMenu").onclick=()=>{readMenu();S.confirmDel="menu";render()};
      if($("#mDelNo"))$("#mDelNo").onclick=()=>{S.confirmDel=null;render()};
      if($("#mDelYes"))$("#mDelYes").onclick=async()=>{if(await write(()=>S.db.doc(base+"/menus/"+S.editMenu).delete(),"ลบเมนูแล้ว")){S.draft=null;S.editMenu=null;S.confirmDel=null;render()}};
      if($("#saveMenu"))$("#saveMenu").onclick=async()=>{readMenu();const m=S.draft;
        if(!m.name){toast("ใส่ชื่อเมนูก่อนบันทึก");return}
        const body={name:m.name,price:n(m.price),bom:m.bom.filter(b=>b.ingredient),updatedAt:new Date().toISOString()};
        const ref=S.editMenu==="new"?S.db.collection(base+"/menus").doc():S.db.doc(base+"/menus/"+S.editMenu);
        if(await write(()=>ref.set(body),"บันทึกเมนูแล้ว")){S.draft=null;S.editMenu=null;render()}};
    }
  }
}
window.addEventListener("bc-rerender",()=>{if(S.brand)rerender()});
boot();
})();
</script>

</body>
</html>
